name: Reproduce heat benchmark

on:
  push:
    branches: [main, 'repro/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-reproduction.txt
      - run: python -m pip install -r requirements-reproduction.txt
      - name: Audit all published evidence and tables
        run: python -m reproducers.heat_reproduce verify
      - name: Numerical and mutation regression tests
        run: python -W ignore::DeprecationWarning -m pytest -q -p no:cacheprovider tests
      - name: Fresh-process smoke and full-array comparison
        run: |
          python -m reproducers.heat_reproduce smoke --output runs/smoke
          python -m reproducers.heat_reproduce check-run runs/smoke
      - name: Complete NetBounds matrix and reference replay
        run: |
          python -m reproducers.heat_reproduce run --netbounds-and-references-only --output runs/netbounds
          python -m reproducers.heat_reproduce check-run runs/netbounds
